<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Courier New", monospace;
  color: #cc00ff;
  background:
    radial-gradient(circle at 20% 10%, rgba(150,0,190,0.2), transparent 0%),
    radial-gradient(circle at 80% 90%, rgba(90,0,140,0.2), transparent 0%),
    radial-gradient(circle at center, #16001c 0%, #07000a 40%, #000 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(204,0,255,0.055) 0px,
    rgba(204,0,255,0.055) 1px,
    transparent 4px,
    transparent 8px
  );
  animation: scan 8s linear infinite;
  z-index: 999;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, rgba(204,0,255,0.035), transparent 55%),
    repeating-linear-gradient(
      90deg,
      transparent 4,
      transparent 8px,
      rgba(204,0,255,0.012) 4px

}

body.site-dormant {
  background:
    radial-gradient(circle at 20% 10%, rgba(145,145,145,0.22), transparent 0%),

    radial-gradient(circle at center, #181818 0%, #090909 70%, #000 100%);
}

body.site-dormant::before {
  background: repeating-linear-gradient(
    to bottom,
    rgba(175,175,175,0.045) 0px,
    rgba(175,175,175,0.045) 1px,
    transparent 4px,
    transparent 8px
  );
}

body.site-dormant::after {
  background:
    radial-gradient(circle at 50% 50%, rgba(175,175,175,0.025), transparent 55%),
    repeating-linear-gradient(
      90deg,
      transparent 4,
      transparent 8px,
      rgba(175,175,175,0.01) 4px
    );
}

body.site-dormant .wake-overlay {
  color: #aaa;
  text-shadow: 0 0 10px rgba(170,170,170,0.35);
}

body.site-dormant .wake-message {

<script>

const BACKGROUND_MUSIC_SRC = "/assets/captainslog.mp3";

const stations = [
  { x: 284, y: 713, src: "/assets/frequency1.mp3" },
  { x: 401, y: 675, src: "/assets/frequency2.mp3" },
  { x: 852, y: 546, src: "/assets/frequency3.mp3" },
  { x: 666, y: 344, src: "/assets/frequency4.mp3" },
  { x: 913, y: 132, src: "/assets/frequency5.mp3" }
];

/* ===== BG MUSIC ===== */
const wakeOverlay = document.getElementById("wakeOverlay");
const musicMuteButton = document.getElementById("musicMuteButton");
const backgroundAudio = document.getElementById("backgroundAudio");
let siteActive = false;
let backgroundManuallyMuted = false;
let radioAudioIsPlaying = false;

backgroundAudio.src = BACKGROUND_MUSIC_SRC;
backgroundAudio.loop = true;
backgroundAudio.volume = 0.4;
backgroundAudio.muted = false;

function updateMusicMuteButton() {
  backgroundAudio.muted = backgroundManuallyMuted || radioAudioIsPlaying;

  if (radioAudioIsPlaying) {
    musicMuteButton.textContent = "AUTO MUTE";
  } else {
    musicMuteButton.textContent = backgroundManuallyMuted ? "UNMUTE" : "MUTE";
  }
}

async function activateSite() {
  if (siteActive) return;

  siteActive = true;
  document.body.classList.remove("site-dormant");
  wakeOverlay.hidden = true;
  startSonar();
  startSpecialDotTimer();
  updateMusicMuteButton();

  try {
    await backgroundAudio.play();
  } catch (error) {
    console.warn("background music couldnt start:", error);
  }
}

wakeOverlay.addEventListener("click", activateSite);
wakeOverlay.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    activateSite();
  }
});

musicMuteButton.addEventListener("click", async () => {
  backgroundManuallyMuted = !backgroundManuallyMuted;
  updateMusicMuteButton();

  if (!siteActive) {
    await activateSite();
  }
});
updateMusicMuteButton();

/* ===== sonar ===== */
const canvas = document.getElementById("sonarCanvas");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("sonarStats");

function resizeCanvas() {
  canvas.width = Math.max(1, canvas.clientWidth);
  canvas.height = Math.max(1, canvas.clientHeight);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let angle = 0;
let waveformPhase = 0;
let blips = [];
let statTick = 0;
let sonarRunning = false;
let sonarFrameRequested = false;
let specialDot = null;
let specialDotTimer = null;
let calibration = null;
let statCache = { gy: 0, flux: 0, bias: 0, noise: 0 };
const hiddenBinary = "11111111";

function drawGrid(cx, cy, radius) {
  ctx.strokeStyle = "rgba(255,0,204,0.2)";
  ctx.lineWidth = 1;

  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (radius / 4) * i, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(cx - radius, cy);
  ctx.lineTo(cx + radius, cy);
  ctx.moveTo(cx, cy - radius);
  ctx.lineTo(cx, cy + radius);
  ctx.stroke();
}

function drawSweep(cx, cy, radius) {
  const sweepWidth = 0.25;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  grad.addColorStop(0, "rgba(255,0,204,0.25)");
  grad.addColorStop(1, "rgba(255,0,204,0)");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, angle - sweepWidth, angle);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#ff00cc";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  ctx.stroke();
}

function drawWaveform(w, h) {
  const baseY = h - 28;
  ctx.strokeStyle = "#ff00cc";
  ctx.lineWidth = 1.2;
  ctx.beginPath();

  for (let x = 0; x < w; x++) {
    const bitIndex = Math.floor((x + waveformPhase) / 40) % hiddenBinary.length;
    const bit = hiddenBinary[bitIndex] === "1" ? 1 : 0;
    const amp = bit ? 24 : 5;
    const y = baseY
      + Math.sin((x + waveformPhase) * 0.09) * amp
      + Math.sin((x + waveformPhase) * 0) * 4;

    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
  waveformPhase += 0.75;
}

function spawnSpecialDot() {
  if (!siteActive || stations.length === 0) return;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.max(12, Math.min(cx, cy) - 22);
  const a = Math.random() * Math.PI * 2;
  const d = Math.random() * radius * 0.72;

  specialDot = {
    x: cx + Math.cos(a) * d,
    y: cy + Math.sin(a) * d,
    bornAt: Date.now()
  };
}

function startSpecialDotTimer() {
  if (specialDotTimer) clearInterval(specialDotTimer);
  // dot appears 30 seconds after active
  specialDotTimer = setInterval(spawnSpecialDot, 30000);
}

function drawSpecialDot() {
  if (!specialDot) return;

  const pulse = 1 + Math.sin(Date.now() / 180) * 0.22;
  ctx.save();
  ctx.shadowColor = "#00ffd0";
  ctx.shadowBlur = 18;
  ctx.fillStyle = "#00ffd0";
  ctx.beginPath();
  ctx.arc(specialDot.x, specialDot.y, 5 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(0,255,208,0.85)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(specialDot.x, specialDot.y, 10 * pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function updateStats() {
  statTick++;
  if (statTick % 45 === 0) {
    statCache.gy = (Math.random() * 10).toFixed(1);
    statCache.flux = Math.floor(Math.random() * 120);
    statCache.bias = Math.floor(Math.random() * 240);
    statCache.noise = Math.floor(Math.random() * 4);
  }

  const weird = Math.min(99, Math.floor(blips.length * 3));
  const integrity = Math.max(0, 100 - weird);
  if (calibration && Date.now() >= calibration.expiresAt) {
    calibration = null;
  }

  let gyValue = statCache.gy;
  let fluxValue = `${statCache.flux}%`;
  if (calibration) {
    gyValue = String(calibration.y).padStart(3, "0");
    fluxValue = String(calibration.x).padStart(3, "0");
  }

  statsEl.innerHTML =
    `FLUX: ${fluxValue}<br>
     GY: ${gyValue}<br>
     NEURAL BIAS: ${statCache.bias}<br>
     REALITY INTEGRITY: ${integrity}%<br>
     NOISE FLOOR: ${statCache.noise} LVL<br>
     ODD TIDE: ${weird > 40 ? "RISING" : "LOW"}`;
}

function drawSonar() {
  if (!sonarRunning) return;

  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.max(1, Math.min(cx, cy) - 10);

  drawGrid(cx, cy, radius);
  drawSweep(cx, cy, radius);

  if (Math.random() < 0.035) {
    const d = Math.random() * radius * 0.6 + radius * 0.2;
    blips.push({
      x: cx + Math.cos(angle) * d,
      y: cy + Math.sin(angle) * d,
      life: 1,
      baseSize: Math.random() * 2 + 2,
      secret: Math.random() < 0.08,
      pingBoost: 0
    });
  }

  blips.forEach(blip => {
    const pointAngle = Math.atan2(blip.y - cy, blip.x - cx);
    const difference = Math.abs(pointAngle - angle);
    if (difference < 0.08) blip.pingBoost = 1;

    ctx.fillStyle = `rgba(255,0,204,${blip.life})`;
    ctx.beginPath();
    ctx.arc(blip.x, blip.y, 3, 0, Math.PI * 2);
    ctx.fill();

    blip.pingBoost *= 0.85;
    blip.life -= 0.008;
  });

  blips = blips.filter(blip => blip.life > 0);
  drawSpecialDot();
  angle += 0.019;
  drawWaveform(canvas.width, canvas.height);
  updateStats();
  sonarFrameRequested = false;
  requestAnimationFrame(drawSonar);
  sonarFrameRequested = true;
}

function startSonar() {
  if (sonarRunning) return;
  resizeCanvas();
  sonarRunning = true;
  if (!sonarFrameRequested) {
    sonarFrameRequested = true;
    requestAnimationFrame(drawSonar);
  }
}

canvas.addEventListener("click", event => {
  if (!siteActive || !specialDot) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clickX = (event.clientX - rect.left) * scaleX;
  const clickY = (event.clientY - rect.top) * scaleY;
  const distance = Math.hypot(clickX - specialDot.x, clickY - specialDot.y);

  if (distance > 16) return;

  // dot selects a pair
  const selectedStation = stations[Math.floor(Math.random() * stations.length)];
  calibration = {
    x: selectedStation.x,
    y: selectedStation.y,
    expiresAt: Date.now() + 10000
  };
  specialDot = null;
});

/* ===== RADIO ===== */
const dialX = document.getElementById("dialX");
const dialY = document.getElementById("dialY");
const freqValue = document.getElementById("freqValue");
const radioAudio = document.getElementById("radioAudio");
const hintX = document.getElementById("hintX");
const hintY = document.getElementById("hintY");
const volumeBar = document.getElementById("volumeBar");
const muteBtn = document.getElementById("radioMute");
const volUp = document.getElementById("volUp");
const volDown = document.getElementById("volDown");

radioAudio.loop = true;
radioAudio.volume = 0.6;

function updateDisplay() {
  const x = Number(dialX.value);
  const y = Number(dialY.value);
  freqValue.textContent = `${x}.${String(y).padStart(3, "0")}`;

  const xLocked = stations.some(station => station.x === x);
  const yLocked = stations.some(station => station.y === y);
  const matchedStation = stations.find(station => station.x === x && station.y === y);

  hintX.classList.toggle("correct", xLocked);
  hintY.classList.toggle("correct", yLocked);

  if (siteActive && matchedStation) {
    if (radioAudio.getAttribute("src") !== matchedStation.src) {
      radioAudio.pause();
      radioAudio.src = matchedStation.src;
      radioAudio.load();
    }
    if (radioAudio.paused) {
      radioAudio.play()
        .then(() => {
          radioAudioIsPlaying = !radioAudio.paused;
          updateMusicMuteButton();
        })
        .catch(error => {
          radioAudioIsPlaying = false;
          updateMusicMuteButton();
          console.warn("Radio recording could not play:", error);
        });
    }
    } else {
    radioAudio.pause();
    radioAudioIsPlaying = false;
    updateMusicMuteButton();
    }
}

dialX.addEventListener("input", updateDisplay);
dialY.addEventListener("input", updateDisplay);
updateDisplay();

function updateVolumeUI() {
  volumeBar.style.width = `${radioAudio.volume * 100}%`;
}
updateVolumeUI();

volUp.addEventListener("click", () => {
  radioAudio.volume = Math.min(1, Math.round((radioAudio.volume + 0.1) * 10) / 10);
  updateVolumeUI();
});

volDown.addEventListener("click", () => {
  radioAudio.volume = Math.max(0, Math.round((radioAudio.volume - 0.1) * 10) / 10);
  updateVolumeUI();
});

muteBtn.addEventListener("click", () => {
  radioAudio.muted = !radioAudio.muted;
  muteBtn.textContent = radioAudio.muted ? "UNMUTE" : "MUTE";
});

/* ===== 5MONITOR ===== */
const responses = {
  "14153": "nope wrong equation",
  "34132": "still the wrong equation",
  "34115": "you are considerably bad at math",
  "34114": "try as you might, you are still bad at mathematics",
  "12134": "something is wrong",
  "11321": "something is correct",
  "11111": "we are number one!",
  "22222": "he",
  "33333": "rule of three",
  "44444": "death, comes four you",
  "55555": "the untouchable number",
  "55252": "vale is watching you, at all times... but how?",
