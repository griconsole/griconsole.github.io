<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protocol V</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/faviconC.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/faviconC.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05060a;
    font-family:'IBM Plex Mono', monospace;
    color:#dce7ff;
}

/* ========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.18;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    background:
        radial-gradient(circle at center, rgba(90,110,255,0.08), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03), transparent 40%);
    pointer-events:none;
}

/* ========================= */

#starfield{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

*{
    scrollbar-width:thin;
    scrollbar-color:rgba(180,200,255,0.42) #070911;
}

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-track{
    background:#070911;
    border-left:1px solid rgba(180,200,255,0.10);
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(to bottom, rgba(180,200,255,0.55), rgba(80,100,150,0.45));
    border:2px solid #070911;
    border-radius:0;
}

::-webkit-scrollbar-thumb:hover{
    background:rgba(210,225,255,0.78);
}

/* ========================= */

#header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.08);
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(5px);
    z-index:100;
}

#status{
    opacity:0.55;
    letter-spacing:0.08em;
}

/* ========================= */

#workspace{
    position:absolute;
    inset:70px 0 0 0;
    z-index:2;
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    grid-template-rows:repeat(3, minmax(140px, 1fr));
    gap:clamp(12px, 1.6vw, 22px);
    padding:clamp(16px, 2.5vw, 30px);
    padding-bottom:92px;
    overflow-x:hidden;
    overflow-y:auto;
    align-content:start;
    overscroll-behavior:contain;
}

/* ========================= */

.note{
    position:relative;
    width:100%;
    min-width:0;
    min-height:0;
    height:100%;
    padding:clamp(12px, 1.35vw, 18px);
    background:rgba(12,15,24,0.96);
    border:1px solid rgba(180,200,255,0.14);
    transition:0.22s ease;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,0,0,0.45);
    overflow:hidden;
}

.note:hover{
    border-color:rgba(255,255,255,0.38);
    transform:translateY(-3px);
}

.note h3{
    font-size:clamp(0.68rem, 1vw, 0.86rem);
    line-height:1.35;
    margin-bottom:clamp(6px, 0.8vw, 10px);
    color:#eef3ff;
}

.note p{
    font-size:clamp(0.60rem, 0.82vw, 0.72rem);
    line-height:1.55;
    opacity:0.72;
}

/* ========================= */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(16px, 3vh, 30px) 16px;
    overflow-x:hidden;
    overflow-y:auto;
    scrollbar-gutter:stable;
    z-index:500;
}

#overlay.active{
    display:flex;
}

#overlay::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.025) 1px,
            transparent 2px,
            transparent 4px
        );
    background-position:0 0;
    opacity:0.45;
    animation:scan 1.2s linear infinite;
    pointer-events:none;
    transform:none;
}

@keyframes scan{
    from{background-position:0 0;}
    to{background-position:0 4px;}
}

#panel{
    position:relative;
    display:flex;
    flex-direction:column;
    width:min(760px, 92vw);
    min-height:min(220px, calc(100dvh - 48px));
    max-height:calc(100dvh - 48px);
    margin:auto;
    background:#090c14;
    border:1px solid rgba(255,255,255,0.12);
    padding:clamp(14px, 2.2vw, 24px);
    z-index:2;
    box-shadow:0 0 35px rgba(0,0,0,0.6);
    overflow:hidden;
}

#panel h2{
    flex:0 0 auto;
    font-size:0.82rem;
    margin-bottom:12px;
    letter-spacing:0.08em;
    color:#f2f5ff;
}

#panel pre{
    flex:1 1 auto;
    min-height:0;
    max-height:calc(100dvh - 130px);
    overflow-y:auto;
    overscroll-behavior:contain;
    padding-right:10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.65;
    font-size:0.72rem;
    opacity:0.86;
}

/* ========================= */

#access{
    position:fixed;
    right:18px;
    bottom:16px;
    width:82px;
    height:46px;
    border:2px solid rgba(255,255,255,0.15);
    background:#0a0d14;
    color:#dce7ff;
    display:grid;
    place-items:center;
    cursor:pointer;
    z-index:120;
    font-family:inherit;
    letter-spacing:0.12em;
    transition:0.22s ease;
}

#access:hover{
    border-color:rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.04);
}

#access span{
    opacity:0.6;
    font-size:0.85rem;
}

/* ========================= */

#terminal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.94);
    display:none;
    place-items:center;
    z-index:1000;
}

#terminal.active{
    display:grid;
}

.terminalBox{
    width:480px;
    border:1px solid rgba(255,255,255,0.12);
    background:#05070c;
    padding:20px;
    position:relative;
    overflow:hidden;
}

.terminalBox::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03),
            rgba(255,255,255,0.03) 1px,
            transparent 2px,
            transparent 4px
        );
    opacity:0.4;
    pointer-events:none;
}

.terminalBox h2{
    font-size:0.82rem;
    margin-bottom:16px;
    letter-spacing:0.18em;
    color:#e5edff;
}

.terminalBox input{
    width:100%;
    padding:12px;
    background:black;
    border:1px solid rgba(255,255,255,0.15);
    color:#dce7ff;
    outline:none;
    font-family:inherit;
}

.terminalBox input:focus{
    border-color:rgba(255,255,255,0.4);
}

.hint{
    margin-top:10px;
    opacity:0.42;
    font-size:0.7rem;
}

/* ========================= */

#cursor{
    position:fixed;
    width:14px;
    height:14px;
    border:1px solid rgba(255,255,255,0.7);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* ========================= */

.glitch{
    animation:glitch 0.18s;
}

@keyframes glitch{
    0%{transform:translate(0,0);}
    25%{transform:translate(2px,-2px);}
    50%{transform:translate(-2px,2px);}
    75%{transform:translate(2px,1px);}
    100%{transform:translate(0,0);}
}

/* ========================= */

.fade{
    animation:fadeOut 2.2s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        filter:blur(6px);
    }
}


@media (max-width: 1050px){
    #workspace{
        grid-template-columns:repeat(3, minmax(0, 1fr));
        grid-template-rows:none;
        grid-auto-rows:minmax(150px, 210px);
    }
}

@media (max-width: 680px){
    #header{
        padding:12px 14px;
        font-size:0.72rem;
    }

    #workspace{
        inset:62px 0 0 0;
        grid-template-columns:repeat(2, minmax(0, 1fr));
        grid-auto-rows:minmax(138px, 180px);
        gap:12px;
        padding:14px;
        padding-bottom:84px;
    }

    #panel{
        width:min(760px, 94vw);
    }
}

@media (max-width: 390px){
    #workspace{
        grid-template-columns:minmax(0, 1fr);
        grid-auto-rows:minmax(125px, 160px);
    }

    #status{
        font-size:0.62rem;
    }
}

</style>
</head>

<script>
const workspace = document.getElementById("workspace");
const overlay = document.getElementById("overlay");
const panelTitle = document.getElementById("panelTitle");
const panelText = document.getElementById("panelText");
const terminal = document.getElementById("terminal");
const input = document.getElementById("codeInput");
const access = document.getElementById("access");
const cursor = document.getElementById("cursor");
const starfield = document.getElementById("starfield");
const starContext = starfield.getContext("2d");
let stars = [];
let starWidth = window.innerWidth;
let starHeight = window.innerHeight;

function resizeStarfield(){
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    starWidth = window.innerWidth;
    starHeight = window.innerHeight;
    starfield.width = Math.floor(starWidth * ratio);
    starfield.height = Math.floor(starHeight * ratio);
    starfield.style.width = starWidth + "px";
    starfield.style.height = starHeight + "px";
    starContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    const count = Math.min(190, Math.max(65, Math.floor(starWidth * starHeight / 6500)));
    stars = Array.from({length:count}, ()=>({
        x:Math.random() * starWidth,
        y:Math.random() * starHeight,
        radius:0.35 + Math.pow(Math.random(), 2) * 1.9,
        speed:0.08 + Math.random() * 0.34,
        phase:Math.random() * Math.PI * 2,
        twinkle:0.004 + Math.random() * 0.012
    }));
}

function animateStarfield(){
    starContext.clearRect(0, 0, starWidth, starHeight);

    for(const star of stars){
        star.x -= star.speed;
        star.y += star.speed * 0.58;
        star.phase += star.twinkle;

        const opacity = 0.28 + (Math.sin(star.phase) + 1) * 0.22;
        starContext.beginPath();
        starContext.fillStyle = `rgba(220,232,255,${opacity})`;
        starContext.shadowBlur = star.radius > 1.55 ? 5 : 0;
        starContext.shadowColor = "rgba(190,215,255,0.65)";
        starContext.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starContext.fill();

        if(star.x < -3 || star.y > starHeight + 3){
            star.x = starWidth + Math.random() * 30;
            star.y = Math.random() * starHeight * 0.88;
        }
    }

    starContext.shadowBlur = 0;
    requestAnimationFrame(animateStarfield);
}

window.addEventListener("resize", resizeStarfield);
resizeStarfield();
animateStarfield();

/* ========================= */

document.addEventListener("mousemove", e=>{
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

const notes = [


{
    title:"Project FP: The Foundation",
    text:`
I have taken up this project at the recommendation of my contact, a rather unusual individual who refers to himself as Zight. His appearance is peculiar, very... red. His methods are questionable, and his understanding of the world beyond our own is considerably more advanced than anything I have encountered in conventional research.

His request is simple enough: he wishes to return to his home realm and reunite with his mother, whom he claims to be separated from. An admittedly sentimental objective, but one that has provided me with an opportunity I would be simply heartless to ignore.
He has supplied me with an apparatus capable of anchoring repeating timelines. I have since designated it the INFERNAL MACHINE, or as Z calls it, the INFINITE MACHINE. Its purpose is to maintain iterations between a given time loop. Whoever is within 30 feet of the Infernal Machine gets anchored in the loop's protection.

The machine operates through a variable I have designated as TEMPERATURE. It controls the degree of randomness within the events that constitute an iteration. By adjusting it, I can influence which possibilities are more likely to occur, though I cannot dictate the exact outcome. There are infinitely many possibilities, and even the most carefully calibrated temperature cannot guarantee a particular result.
This is precisely why repeated experimentation is necessary. Trial and Error as they say...

The machine allows me to alter the conditions of each iteration: the recruited subjects, their collective attributes, the corner realms connected to the central portal, and the probability of particular events occurring. Through careful observation and recalculation, I intend to identify the most optimal combination.

My actual objective is to extract PERSEVERANCE from these generated vessels. Zight has spoken of this quality with considerable enthusiasm, describing it as a power capable of pushing human limitations beyond their natural boundaries. Imagine a humanity that cannot be stopped by adversity, that can surpass any obstacle simply by refusing to accept its limitations. An invention of such magnitude would redefine everything we understand about human potential...
And, perhaps more importantly, it would finally prove something.

Herman Wilhelm Gauss... My former laboratory partner... A man who once considered my work inferior to his own. I intend to demonstrate that Val.. I am not merely worthy of standing beside him, but that I am, and always have been, his superior.

The first obstacle is finding a suitable researcher to assist with the construction of the experimental environment. I have encountered a broken old doctor who approached me with an interest in the Quantum Theorem. Dr. Ebb. His knowledge is rather basic, but sufficient for the task.
I provided him with the blueprints for the Axiom-Fold Continuum Engine, an apparatus designed to connect to sixteen different corner realms. I'll admit this was not my original creation, although the work I was... -inpsired- from had its flaws. It was too... ungrand, for a lack of better words. The doctor seemed strangely familiar with its construction, despite having no reasonable explanation for such familiarity. I suspect he has encountered something similar before.

My contact arranged for the Infernal Machine to activate and initiate its first iteration at precisely the moment Ebb would draft his recruit list. The resulting failure in calibration was intentional. A controlled disruption was necessary to establish the initial conditions.
I will be observing the resulting subjects personally and from far away.

Let us see what humanity is capable of when given the opportunity to exceed its very soul and drive.
`

notes.forEach(note=>{
    const div = document.createElement("div");
    div.className = "note";

    div.innerHTML = `
        <h3>${note.title}</h3>
        <p>${note.text.slice(0,75)}...</p>
    `;
    div.onclick = ()=>{

        panelTitle.textContent = note.title;
        panelText.textContent = note.text;
        panelText.scrollTop = 0;
        overlay.classList.add("active");
    };
    workspace.appendChild(div);
});

overlay.onclick = e=>{
    if(e.target === overlay){
        overlay.classList.remove("active");
    }
};

access.onclick = ()=>{
    terminal.classList.add("active");
    input.focus();
};

terminal.addEventListener("click", e=>{
    if(e.target === terminal){
        terminal.classList.remove("active");
    }

});

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

async function typeLine(text){
    const div = document.createElement("div");
    div.style.marginBottom = "10px";
    terminal.querySelector(".terminalBox").appendChild(div);
    for(let i=0;i<text.length;i++){
        div.textContent += text[i];
        await sleep(18);
    }
}

function clearPrompt(){
    const box = terminal.querySelector(".terminalBox");
    box.innerHTML = "";
}

async function finalSequence(lines){
    clearPrompt();
    
    for(const line of lines){
        await typeLine(line);
        await sleep(500);
    }

    terminal.classList.add("glitch");
    await sleep(2500);
    document.body.classList.add("fade");
    
    setTimeout(()=>{
        window.location.href = "/anomaly/revelation";
    },2200);
}

input.addEventListener("keydown", async e=>{
    if(e.key === "Enter"){
        const value = input.value.trim();
        
        if(value === "73604"){
            await finalSequence([
                ">protocol V updated",
                ">Welcome Dr.Vale",
                "...",
                "the truth",
                "chase after it",
                "aspice stellas",
                ">ascending..."
            ]);
            
        }else{
            terminal.classList.add("glitch");
            setTimeout(()=>{
                terminal.classList.remove("glitch");
            },180);
        }
        input.value = "";
    }
});
</script>
