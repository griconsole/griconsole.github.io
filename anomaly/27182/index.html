<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protocol V</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/faviconC.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/faviconC.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05060a;
    font-family:'IBM Plex Mono', monospace;
    color:#dce7ff;
}

/* ========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.18;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center, rgba(90,110,255,0.08), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03), transparent 40%);
    pointer-events:none;
}

/* ========================= */

#header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.08);
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(5px);
    z-index:100;
}

#status{
    opacity:0.55;
    letter-spacing:0.08em;
}

/* ========================= */

#workspace{
    position:absolute;
    inset:70px 0 0 0;
    overflow:hidden;
}

#workspace::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:90px;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(5,6,10,0.96)
    );
    pointer-events:none;
}

/* ========================= */

.note{
    position:absolute;
    width:150px;
    min-height:88px;
    padding:10px;
    background:rgba(12,15,24,0.96);
    border:1px solid rgba(180,200,255,0.14);
    transition:0.22s ease;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,0,0,0.45);
}

.note:hover{
    border-color:rgba(255,255,255,0.38);
    transform:translateY(-3px);
}

.note h3{
    font-size:0.70rem;
    margin-bottom:8px;
    color:#eef3ff;
}

.note p{
    font-size:0.60rem;
    line-height:1.55;
    opacity:0.72;
}

/* ========================= */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
}

#overlay.active{
    display:flex;
}

#overlay::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.025) 1px,
            transparent 2px,
            transparent 4px
        );
    opacity:0.45;
    animation:scan 0.08s linear infinite;
    pointer-events:none;
}

@keyframes scan{
    from{transform:translateY(0);}
    to{transform:translateY(4px);}
}

#panel{
    position:relative;
    width:min(520px,85vw);
    min-height:260px;
    background:#090c14;
    border:1px solid rgba(255,255,255,0.12);
    padding:20px;
    z-index:2;
    box-shadow:0 0 35px rgba(0,0,0,0.6);
}

#panel h2{
    font-size:0.92rem;
    margin-bottom:16px;
    letter-spacing:0.08em;
    color:#f2f5ff;
}

#panel pre{
    white-space:pre-wrap;
    line-height:1.8;
    font-size:0.78rem;
    opacity:0.86;
}

/* ========================= */

#access{
    position:fixed;
    right:18px;
    bottom:16px;
    width:82px;
    height:46px;
    border:2px solid rgba(255,255,255,0.15);
    background:#0a0d14;
    color:#dce7ff;
    display:grid;
    place-items:center;
    cursor:pointer;
    z-index:120;
    font-family:inherit;
    letter-spacing:0.12em;
    transition:0.22s ease;
}

#access:hover{
    border-color:rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.04);
}

#access span{
    opacity:0.6;
    font-size:0.85rem;
}

/* ========================= */

#terminal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.94);
    display:none;
    place-items:center;
    z-index:1000;
}

#terminal.active{
    display:grid;
}

.terminalBox{
    width:480px;
    border:1px solid rgba(255,255,255,0.12);
    background:#05070c;
    padding:20px;
    position:relative;
    overflow:hidden;
}

.terminalBox::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03),
            rgba(255,255,255,0.03) 1px,
            transparent 2px,
            transparent 4px
        );
    opacity:0.4;
    pointer-events:none;
}

.terminalBox h2{
    font-size:0.82rem;
    margin-bottom:16px;
    letter-spacing:0.18em;
    color:#e5edff;
}

.terminalBox input{
    width:100%;
    padding:12px;
    background:black;
    border:1px solid rgba(255,255,255,0.15);
    color:#dce7ff;
    outline:none;
    font-family:inherit;
}

.terminalBox input:focus{
    border-color:rgba(255,255,255,0.4);
}

.hint{
    margin-top:10px;
    opacity:0.42;
    font-size:0.7rem;
}

/* ========================= */

#cursor{
    position:fixed;
    width:14px;
    height:14px;
    border:1px solid rgba(255,255,255,0.7);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* ========================= */

.glitch{
    animation:glitch 0.18s;
}

@keyframes glitch{
    0%{transform:translate(0,0);}
    25%{transform:translate(2px,-2px);}
    50%{transform:translate(-2px,2px);}
    75%{transform:translate(2px,1px);}
    100%{transform:translate(0,0);}
}

/* ========================= */

.fade{
    animation:fadeOut 2.2s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        filter:blur(6px);
    }
}
</style>
</head>

<body>

<div id="cursor"></div>

<div id="header">
    <div>PROTOCOL V // ACTIVE</div>
    <div id="status">archive/projectFP/notes</div>
</div>

<div id="workspace"></div>

<div id="overlay">
    <div id="panel">
        <h2 id="panelTitle"></h2>
        <pre id="panelText"></pre>
    </div>
</div>

<div id="access">
    <span>ACCESS</span>
</div>

<div id="terminal">
    <div class="terminalBox">
        <h2>ACCESS INPUT</h2>

        <input
            id="codeInput"
            type="number"
            maxlength="5"
            autocomplete="off"
        >

    </div>
</div>

<script>
const workspace = document.getElementById("workspace");
const overlay = document.getElementById("overlay");
const panelTitle = document.getElementById("panelTitle");
const panelText = document.getElementById("panelText");
const terminal = document.getElementById("terminal");
const input = document.getElementById("codeInput");
const access = document.getElementById("access");
const cursor = document.getElementById("cursor");

/* ========================= */

document.addEventListener("mousemove", e=>{
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

/* ========================= */

const notes = [


{
title:"Experiment Delta [FAILED]",
text:`
Currently on the last loop for this experiment, the subjects have been experiencing drawbacks.

Every recalculation leads back to the same impossible conclusion. The formula SHOULD stabilize the outbreaks and sudden pains.
It was mathematically flawless when I redesigned it... so why does it continue to fail me?

In accordance with the blueprints provided, calibration remained fixed at:
█7██.█████.████

I warned Ebb not to rush the assembly. Of course, he ignored me. Half of the conduits were soldered like a child piecing together scrap metal.
For the next Experiment, I plan on handling the construction process myself. That way, if any errors occur, it will be easy to identify them.

Let this experience stand as proof:
never allow amateurs to imitate my brilliance...
`
},

{
title:"Project FP",
text:`
I have taken up this project at the recommendation of my contact. It has piqued my interest considerably.
Throughout each experiment I conduct, I will be noting the results, statistics, and reports for each event and loop that takes place.

Finding an eager and equally deranged researcher to help me build this machine has been a headache, but recently I've found a broken old doctor.
During my search for a worthy candidate, he came to me eagerly talking on and on about the Quantum Theorem. His knowledge of it was base-level at best, but sufficient enough for him to get the job done.

I offered him a position at the designated location my contact and I agreed upon and gave him the machine's blueprints.
An oddity I perceived was that he seemed familiar with the blueprint's design. It felt as though he had seen that machine before, even though I was the original designer, with the help of my contact, of course.
Unless he has encountered my contact as well, it would be impossible for him to recognize or be familiar with such a design... something is wrong, and I can feel it.

I will keep an eye out for any anomalies that may appear during construction. My contact set the gadget to break at exactly the time when Ebb would draft a recruit list.
That way, we can alter the temperature to change the timeline and potentially cause time to loop as well, with the right formula.
`
},

{
title:"Emergency Formula",
text:`
If that infernal gadget ever fails to function again, this is the emergency restoration sequence.
Read carefully. I am aware most personnel here barely understand the equations they operate around, so I will simplify this as much as my pride allows.

████████████████ ███████ ███████████ ████ █4██████████████████ █████

Reroute quantum flow BEFORE inserting the solution.
The last assistant who ignored that distinction liquefied against the chamber wall in under three seconds.

If the gadget has already begun destabilizing, do NOT attempt to restart the primary flow.
The emergency sequence is intended to restore the machine after failure, not prevent it.

Stabilize the core.
Reroute the flow.
Then insert the solution.

In that order.
`
},

{
title:"Subject-04o7's Breach",
text:`
Subject-04o7 has breached the containment protocol.

He has seemingly abandoned the project, at least outwardly, but I do not believe his departure was voluntary.
Damien has been observing the inconsistencies surrounding the experiments for some time now.
He has begun asking questions that subjects are not supposed to ask, and worse, he has started looking for answers beyond what I have allowed them to see.

After realizing the truth behind their nature, eventually, they all break in one way or another. But Damien was different.

His optimism is irritatingly persistent. It reminds me of someone I knew before all of this began. Even before the PSC.
Perhaps that is why I continued monitoring him personally.
He found something.

I do not yet know how much he understands, but he has interfered with the project, accessed information outside his designated parameters, and attempted to escape the conditions of the experiment.
I have marked the incident as a breach rather than a failure. The experiment must continue!

If Subject-04o7 returns, he is to be monitored closely.
If he does not... Then his absence will simply become another variable.
`
},

{
title:"Experiment Alpha [FAILED]",
text:`
A fresh batch of subjects acquired through conventional recruitment methods. Ebb has given us quite an... interesting bunch.
I'm afraid this experiment might be shorter than the others. I truly can't force myself to endure these subjects any longer.

At first, their understanding of Quantum theory appeared surface-level at best. The problem with this bunch was that their desire to learn was never present.
Initial team cohesion was quite abysmal. Constant arguments and poor coordination...
I'm surprised they managed to survive for longer than a week.

Yet somehow, this group continued persisting beyond expected failure points. Not through intelligence, unfortunately, but through stubbornness.
They survive situations that should kill them simply because they refuse to accept outcomes already decided for them.

The following events occurred once the truth of their nature was revealed:
███████████████ ████████ ███████ ███████ ████ █ ██████████████ █6█ █████████ ██████████████ ████████ ██████ █ ███████ █████████████████████████████████
█████ █ ██ █████ ███
███████ ██████ ████ ██████ █ ████████████

███████ ███████ ██ ███████████████ ██████ █████████ █████ ██████ ███ ███████████ ███
███████ ███ ████████████ ██████ ██████████ ███████ █████████████ ██████ ████████████ ████ ███████ █ █████████████████
`
},

{
title:"Experiment Beta [FAILED]",
text:`
Another loop. Another batch of recruits.

This batch was quieter than Alpha. Ebb's choice of recruits keeps on surprising me... Less conflict, but more observation this time. I initially believed them to be more intelligent.
Turns out, they were luckier than the others.

Several members became aware of inconsistencies within the loop far earlier than projected.
One even attempted to map temporal repetition patterns manually before suffering neural collapse due to "unnatural causes"...

Progress remains disappointing... Still, I cannot deny their persistence anymore. Each loop leaves traces behind.
Instincts sharpen, reactions change, somewhere beneath conscious memory, something survives the reset.

Perhaps Midnight was right to fear this project after all.

This batch's Intelligence score was lower than the rest. I've set the temperature to an even ████, so for the next experiment's batch, let's try ██3██...
`
},

{
title:"Activity Records",
text:`
I've hidden the password to an external link within five digits, with clues to the order given below. The numbers have been redacted along the correct digits for your ease...
I made sure to erase all employees' memories once they've figured out the code.

Time Log 01:
Their drawbacks have gotten worse, the pains grew larger as their hearts started to fail... all that was left was a rotted lump of tissue in place of their hearts...

Time Log 02:
Experiment Beta was a failure at best. Sometimes too much intelligence is not the correct way to approach the creation of new subjects... Let's try again with less IQ...

Time Log 03:
Alpha only lasted for a few loops, they were... incompetent... next time maybe I should recommend Ebb which recruits to draft instead.

Time Log 04:
This experiment has been quite fruitful, it is still in progress but I have to pull the plug on this one on this last loop.
Otherwise time will start to distort and as my contact keeps reminding me, that would not be good for either of us...

Time Log 05:
The formula did not work as intended. There has been a flaw in the equation, it seems. Or there might have been sabotage at play. I only suspect that amateur...
`
},

{
title:"Experiment Omega [IN PROGRESS]",
text:`
This recent experiment has proven useful in terms of statistics. The recruits are much more intelligent, but still fail to see the truth.
Perhaps they ignore it, or pretend the things they've seen are just hallucinations of their design.

I've decided to stay far away from the batch this time, letting them run like headless chickens in search of answers. After all these experiments, I'm starting to have fun watching these... idiots look for answers.

The key difference between this experiment and the others has been the selection of my new batch. I've picked the best-performing subjects from the other experiments and placed them in this one.
Along with a newly generated subject, these previous subjects have been quite efficient in terms of problem-solving and defending the machine.

Omega's loop count is currently at 511. I believe the next loop will be the final one for this experiment. I have gotten a ton of information during this one. The project might as well be considered complete...

Time Stamp: ██████-███0████
`
},

];

/* ========================= */

const positions = [
[120,120],
[380,150],
[650,140],
[920,130],

[180,380],
[470,400],
[760,370],
[1050,390],
];

notes.forEach((note,index)=>{
    const div = document.createElement("div");
    div.className = "note";
    div.style.left = positions[index][0] + "px";
    div.style.top = positions[index][1] + "px";

    div.innerHTML = `
        <h3>${note.title}</h3>
        <p>${note.text.slice(0,75)}...</p>
    `;
    div.onclick = ()=>{

        panelTitle.textContent = note.title;
        panelText.textContent = note.text;
        overlay.classList.add("active");
    };
    workspace.appendChild(div);
});

/* ========================= */

overlay.onclick = ()=>{
    overlay.classList.remove("active");
};

/* ========================= */

access.onclick = ()=>{
    terminal.classList.add("active");
    input.focus();
};

terminal.addEventListener("click", e=>{
    if(e.target === terminal){
        terminal.classList.remove("active");
    }

});

/* ========================= */

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

async function typeLine(text){
    const div = document.createElement("div");
    div.style.marginBottom = "10px";
    terminal.querySelector(".terminalBox").appendChild(div);
    for(let i=0;i<text.length;i++){
        div.textContent += text[i];
        await sleep(18);
    }
}

function clearPrompt(){
    const box = terminal.querySelector(".terminalBox");
    box.innerHTML = "";
}
  
/* ========================= */

async function finalSequence(lines){
    clearPrompt();
    
    for(const line of lines){
        await typeLine(line);
        await sleep(500);
    }

    terminal.classList.add("glitch");
    await sleep(2500);
    document.body.classList.add("fade");
    
    setTimeout(()=>{
        window.location.href = "/anomaly/revelation";
    },2200);
}
  
/* ========================= */

input.addEventListener("keydown", async e=>{
    if(e.key === "Enter"){
        const value = input.value.trim();
        
        if(value === "73604"){
            await finalSequence([
                ">protocol V updated",
                ">Welcome Dr.Vale",
                "..."
                "the truth",
                "chase after it"
                "aspice stellas",
                ">ascending..."
            ]);
            
        }else{
            terminal.classList.add("glitch");
            setTimeout(()=>{
                terminal.classList.remove("glitch");
            },180);
        }
        input.value = "";
    }
});
</script>

</body>
</html>
