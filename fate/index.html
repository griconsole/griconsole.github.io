<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GRI // FORTUNE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/faviconGRI.png">

  <style>
    :root {
      --cyan: #00ffcc;
      --cyan-dim: rgba(0, 255, 204, 0.38);
      --cyan-soft: rgba(0, 255, 204, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Courier New", monospace;
      color: var(--cyan);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,255,204,0.055) 0px,
          rgba(0,255,204,0.055) 2px,
          transparent 3px,
          transparent 7px
        );
      animation: scan 8s linear infinite;
      z-index: 20;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(0,0,0,0.58) 100%
        );
      z-index: 19;
    }

    @keyframes scan {
      from { background-position: 0 0; }
      to   { background-position: 0 100%; }
    }

    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.75; }
      98% { opacity: 0.92; }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        filter: blur(4px);
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .card {
      width: min(300px, 80vw);
      height: min(800px, 52vh);
      border: 1px solid var(--cyan);
      background: transparent;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow:
        0 0 15px rgba(0,255,204,0.06),
        inset 0 0 35px rgba(0,255,204,0.02);
      transition:
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .card:hover {
      background: rgba(0,255,204,0.025);
      box-shadow:
        0 0 22px rgba(0,255,204,0.12),
        inset 0 0 45px rgba(0,255,204,0.04);
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0.45;
      transition: opacity 0.25s ease;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--cyan);
    }

    .corner::before {
      width: 100%;
      height: 1px;
    }

    .corner::after {
      width: 1px;
      height: 100%;
    }

    .tl { top: -1px; left: -1px; }
    .tr { top: -1px; right: -1px; transform: rotate(90deg); }
    .br { bottom: -1px; right: -1px; transform: rotate(180deg); }
    .bl { bottom: -1px; left: -1px; transform: rotate(270deg); }

    .card:hover .corner {
      opacity: 0.85;
    }

    .label {
      position: absolute;
      top: 14px;
      left: 135px;
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--cyan-dim);
      animation: flicker 10s infinite;
      pointer-events: none;
    }

    .number {
      position: absolute;
      bottom: 13px;
      right: 110px;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--cyan-dim);
      pointer-events: none;
    }

    .symbol {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      opacity: 0.14;
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
      user-select: none;
      pointer-events: none;
    }

    .card:hover .symbol {
      opacity: 0.07;
      transform: translate(-50%, -50%) scale(1.12);
    }

    .secret {
      width: 80%;
      max-width: 400px;
      text-align: center;
      color: var(--cyan);
      font-size: clamp(10px, 2vw, 12px);
      line-height: 1.4;
      letter-spacing: 1.5px;
      opacity: 0;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,255,204,0.45);
    }

    .card:hover .secret {
      opacity: 1;
      animation: reveal 0.45s ease-out;
    }

    .hint {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0,255,204,0.22);
      font-size: 9px;
      letter-spacing: 2px;
      white-space: nowrap;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .card:hover .hint {
      opacity: 0;
    }
  </style>
</head>

<body>

  <div class="card" id="fortuneCard">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner br"></div>
    <div class="corner bl"></div>

    <div class="label">XXIV</div>
    <div class="number">THE MACHINE</div>

    <div class="symbol">∞</div>

    <div class="secret" id="secretMessage">
      INFINITE POTENTIAL, INFINITE STORIES, YET YOURS WILL NEVER BE COMPLETE<br>
      -<br>
      EACH DIVINATION BRINGS YOU A STEP CLOSER TO THE TRUTH, BUT WHAT IF THE TRUTH IS HAZARDOUS?
    </div>

    <div class="hint">REVEAL YOUR FORTUNE</div>

  </div>

  <script>
    const card = document.getElementById("fortuneCard");
    const secret = document.getElementById("secretMessage");

    card.addEventListener("mouseenter", () => {
      secret.style.animation = "none";
      void secret.offsetWidth;
      secret.style.animation = "reveal 0.45s ease-out";
    });
  </script>

</body>
</html>
