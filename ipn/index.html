<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GRI // GLOBAL RESEARCH INSTITUTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/faviconGRI.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/faviconGRI.png">

  <style>
    :root {
      --cyan: #00ffcc;
      --cyan-bright: #66ffee;
      --cyan-dim: rgba(0,255,204,0.48);
      --cyan-faint: rgba(0,255,204,0.08);
      --black: #000;
      --panel: #030706;
      --line: #0a3a32;
      --text-dim: rgba(0,255,204,0.62);
      --font: "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,255,204,0.65) #020504;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--black);
      color: var(--cyan);
      font-family: var(--font);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== CRT ===== */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,255,204,0.07) 0px,
          rgba(0,255,204,0.07) 3px,
          transparent 4px,
          transparent 8px
        );
      animation: scan 8s linear infinite;
      z-index: 9999;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 48%,
          rgba(0,0,0,0.48) 100%
        );
      z-index: 9998;
    }

    @keyframes scan {
      from { background-position: 0 0; }
      to   { background-position: 0 100%; }
    }

    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.78; }
      98% { opacity: 0.92; }
    }

    @keyframes glitchOpen {
      0% {
        transform: translate(-50%, -50%) scale(0.97);
        opacity: 0;
      }
      45% {
        transform: translate(-50%, -50%) scale(1.01);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #020504;
      border-left: 1px solid rgba(0,255,204,0.08);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0,255,204,0.42);
      border: 1px solid rgba(0,255,204,0.65);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,255,204,0.72);
    }

    button,
    input {
      font: inherit;
    }

    /* ===== SHELL ===== */

    #app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .sidebar {
      min-height: 100vh;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(
          to bottom,
          rgba(0,255,204,0.035),
          transparent 45%
        ),
        #010202;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 4;
    }

    .gri-brand {
      padding: 4px 8px 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      animation: flicker 9s infinite;
    }

    .gri-brand-title {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .gri-brand-sub {
      margin-top: 7px;
      color: var(--text-dim);
      font-size: 10px;
      line-height: 1.5;
    }

    .nav-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin: 15px 8px 7px;
    }

    .nav-btn {
      width: 100%;
      display: block;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--cyan);
      padding: 9px 8px;
      margin-bottom: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      border-color: var(--cyan-dim);
      background: var(--cyan-faint);
      box-shadow: inset 3px 0 0 var(--cyan);
    }

    .nav-btn .count {
      float: right;
      color: var(--text-dim);
      font-size: 10px;
    }

    .sidebar-footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      line-height: 1.65;
      color: var(--text-dim);
    }

    /* ===== MAIN ===== */

    .main {
      min-width: 0;
      min-height: 100vh;
      padding: 22px 26px 50px;
      position: relative;
      z-index: 2;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 15px;
    }

    .page-title {
      font-size: 22px;
      letter-spacing: 2px;
      margin: 0;
    }

    .page-subtitle {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-stack {
      text-align: right;
      font-size: 10px;
      line-height: 1.7;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .status-live {
      color: var(--cyan);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin: 18px 0;
    }

    .tool-input {
      flex: 1;
      min-width: 180px;
      background: #000;
      color: var(--cyan);
      border: 1px solid var(--line);
      padding: 10px 12px;
      outline: none;
    }

    .tool-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0,255,204,0.12);
    }

    .action-btn {
      background: #000;
      color: var(--cyan);
      border: 1px solid var(--cyan-dim);
      padding: 9px 12px;
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: var(--cyan);
      background: var(--cyan-faint);
      box-shadow: 0 0 9px rgba(0,255,204,0.20);
    }

    /* ===== OVERVIEW ===== */

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric {
      border: 1px solid var(--line);
      background: rgba(0,255,204,0.025);
      padding: 13px;
      min-height: 82px;
    }

    .metric-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    .metric-value {
      font-size: 25px;
      margin-top: 9px;
    }

    .dashboard-section {
      border: 1px solid var(--line);
      background:
        linear-gradient(
          135deg,
          rgba(0,255,204,0.03),
          rgba(0,0,0,0.55)
        );
      padding: 15px;
      margin-bottom: 14px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    .section-heading span {
      color: var(--text-dim);
      font-size: 9px;
    }

    .division-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .division-jump {
      min-height: 108px;
      border: 1px solid var(--line);
      background: #000;
      padding: 12px;
      color: var(--cyan);
      cursor: pointer;
      text-align: left;
    }

    .division-jump:hover {
      border-color: var(--cyan);
      background:
        linear-gradient(
          180deg,
          rgba(0,255,204,0.07),
          rgba(0,0,0,0.4)
        );
      box-shadow: 0 0 12px rgba(0,255,204,0.12);
    }

    .division-name {
      font-size: 13px;
      letter-spacing: 1px;
    }

    .division-meta {
      margin-top: 30px;
      font-size: 9px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ===== DIRECTORY ===== */

    .directory-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }

    .directory-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .directory-head small {
      color: var(--text-dim);
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .profile-card {
      border: 1px solid var(--line);
      background:
        linear-gradient(
          145deg,
          rgba(0,255,204,0.035),
          rgba(0,0,0,0.92)
        );
      min-height: 165px;
      padding: 13px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .profile-card::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 2px;
      background: rgba(0,255,204,0.20);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .profile-card:hover {
      border-color: rgba(0,255,204,0.72);
      box-shadow:
        inset 0 0 18px rgba(0,255,204,0.04),
        0 0 10px rgba(0,255,204,0.08);
    }

    .profile-card:hover::after {
      transform: scaleX(1);
    }

    .profile-name {
      font-size: 17px;
      margin-bottom: 7px;
      padding-right: 28px;
    }

    .profile-rank {
      font-size: 10px;
      color: var(--cyan-bright);
      letter-spacing: 1px;
      min-height: 15px;
    }

    .profile-meta {
      margin-top: 12px;
      font-size: 10px;
      line-height: 1.65;
      color: var(--text-dim);
    }

    .profile-index {
      position: absolute;
      top: 11px;
      right: 11px;
      color: rgba(0,255,204,0.25);
      font-size: 10px;
    }

    .empty-results {
      border: 1px dashed var(--line);
      padding: 25px;
      text-align: center;
      color: var(--text-dim);
    }

    .profile-info {
      padding: 18px;
      text-align: left;
      overflow-y: auto;
      min-width: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,255,204,0.72) rgba(0,255,204,0.035);
    }

    .profile-info::-webkit-scrollbar {
      width: 8px;
    }

    .profile-info::-webkit-scrollbar-track {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,255,204,0.035) 0px,
          rgba(0,255,204,0.035) 5px,
          transparent 5px,
          transparent 10px
        );
      border-left: 1px solid rgba(0,255,204,0.12);
    }

    .profile-info::-webkit-scrollbar-thumb {
      background: rgba(0,255,204,0.38);
      border: 1px solid rgba(0,255,204,0.7);
    }

    .profile-info::-webkit-scrollbar-thumb:hover {
      background: rgba(0,255,204,0.72);
    }

    #modalRoot {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(1px);
    }

    #modalRoot.visible {
      display: block;
    }

    .modal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(980px, calc(100vw - 40px));
      height: min(760px, calc(100vh - 40px));
      transform: translate(-50%, -50%);
      border: 1px solid var(--cyan);
      background:
        linear-gradient(
          145deg,
          rgba(0,255,204,0.045),
          rgba(0,0,0,0.98) 45%
        );
      box-shadow:
        0 0 30px rgba(0,255,204,0.15),
        inset 0 0 35px rgba(0,255,204,0.025);
      animation: glitchOpen 0.18s ease-out;
      overflow: hidden;
    }

    .modal-header {
      height: 48px;
      border-bottom: 1px solid var(--line);
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-header-title {
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    .modal-header-meta {
      color: var(--text-dim);
      font-size: 9px;
      text-align: right;
    }

    .modal-close {
      border: 1px solid var(--cyan-dim);
      background: #000;
      color: var(--cyan);
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    .modal-close:hover {
      border-color: var(--cyan);
      background: var(--cyan-faint);
    }

    .profile-modal-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      height: calc(100% - 48px);
      min-height: 0;
    }

    .modal-name {
      text-align: left;
      font-size: 28px;
      letter-spacing: 1px;
      margin: 0;
    }

    .modal-rank {
      text-align: left;
      margin-top: 7px;
      color: var(--cyan-bright);
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .field {
      text-align: left;
      border: 1px solid var(--line);
      padding: 10px;
      background: rgba(0,255,204,0.018);
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field.longtext {
      min-height: 0;
    }

    .field-label {
      text-align: left;
      color: var(--text-dim);
      font-size: 8px;
      letter-spacing: 1.5px;
      margin-bottom: 7px;
    }

    .field-value {
      text-align: left;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 15px;
      overflow-wrap: anywhere;
    }

    .field.longtext .field-value {
      max-height: 190px;
      overflow-y: auto;
      padding-right: 9px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,255,204,0.72) rgba(0,255,204,0.035);
    }

    .field.longtext .field-value::-webkit-scrollbar {
      width: 7px;
    }

    .field.longtext .field-value::-webkit-scrollbar-track {
      background: rgba(0,255,204,0.025);
      border-left: 1px solid rgba(0,255,204,0.08);
    }

    .field.longtext .field-value::-webkit-scrollbar-thumb {
      background: rgba(0,255,204,0.4);
      border: 1px solid rgba(0,255,204,0.7);
    }

    .field.longtext .field-value::-webkit-scrollbar-thumb:hover {
      background: rgba(0,255,204,0.72);
    }

    .field-empty {
      color: rgba(0,255,204,0.16);
    }

    .portrait-panel {
      position: relative;
      border-left: 1px solid var(--line);
      min-width: 0;
      height: 100%;
      background:
        radial-gradient(
          circle at center,
          rgba(0,255,204,0.12),
          transparent 68%
        ),
        #010202;
      overflow: hidden;
    }

    .portrait-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,255,204,0.09) 0px,
          rgba(0,255,204,0.09) 2px,
          transparent 3px,
          transparent 6px
        );
      pointer-events: none;
      z-index: 3;
    }

    .portrait-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0,255,204,0.12),
          rgba(0,255,204,0.02) 55%,
          rgba(0,0,0,0.20)
        );
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 4;
    }

    .portrait-frame {
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(0,255,204,0.55);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter:
        grayscale(1)
        sepia(1)
        hue-rotate(120deg)
        saturate(5)
        contrast(1.1)
        brightness(0.9);
      opacity: 0.82;
    }

    .portrait-placeholder {
      text-align: center;
      color: rgba(0,255,204,0.52);
      padding: 25px;
      font-size: 11px;
      line-height: 1.7;
    }

    .portrait-corner {
      position: absolute;
      z-index: 5;
      font-size: 8px;
      color: rgba(0,255,204,0.55);
    }

    .portrait-corner.tl { left: 9px; top: 7px; }
    .portrait-corner.tr { right: 9px; top: 7px; text-align: right; }
    .portrait-corner.bl { left: 9px; bottom: 7px; }
    .portrait-corner.br { right: 9px; bottom: 7px; text-align: right; }

    #ambientLog {
      position: fixed;
      left: 12px;
      bottom: 10px;
      width: 220px;
      height: 85px;
      overflow: hidden;
      white-space: pre;
      color: rgba(0,255,204,0.22);
      font-size: 9px;
      line-height: 12px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.65;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      border: 1px solid var(--cyan);
      background: #000;
      color: var(--cyan);
      padding: 9px 13px;
      font-size: 10px;
      z-index: 9000;
      display: none;
    }

    @media (max-width: 1100px) {
      #app {
        grid-template-columns: 200px 1fr;
      }

      .division-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .profiles-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .profile-modal-body {
        grid-template-columns: minmax(0, 1fr) 280px;
      }
    }

    @media (max-width: 800px) {
      #app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        min-height: unset;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .sidebar nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }

      .nav-label,
      .sidebar-footer {
        display: none;
      }

      .gri-brand {
        margin-bottom: 10px;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .division-grid,
      .profiles-grid {
        grid-template-columns: 1fr;
      }

      .modal {
        width: calc(100vw - 22px);
        height: calc(100vh - 22px);
      }

      .profile-modal-body {
        grid-template-columns: 1fr;
        grid-template-rows: 270px minmax(0, 1fr);
      }

      .portrait-panel {
        border-left: 0;
        border-bottom: 1px solid var(--line);
      }

      .portrait-frame {
        inset: 18px 25%;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .field.longtext .field-value {
        max-height: 170px;
      }
    }

    @media (max-width: 520px) {
      .main {
        padding: 16px 12px 45px;
      }

      .topbar {
        flex-direction: column;
      }

      .status-stack {
        text-align: left;
      }

      .toolbar {
        flex-direction: column;
      }

      .tool-input {
        width: 100%;
      }

      .portrait-frame {
        inset: 18px 19%;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <aside class="sidebar">

    <div class="gri-brand">
      <div class="gri-brand-title">G.R.I.</div>
      <div class="gri-brand-sub">
        GLOBAL RESEARCH INSTITUTE<br>
        INTERNAL PERSONNEL NETWORK<br>
        BUILD // 1996.02.29
      </div>
    </div>

    <div class="nav-label">DIRECTORY</div>
    <nav id="divisionNav"></nav>

    <div class="nav-label">INSTITUTION</div>
    <button class="nav-btn" data-view="overview">
      &gt; RETURN TO OVERVIEW
    </button>

    <div class="sidebar-footer">
      ACCESS CLASS: INTERNAL<br>
      PERSONNEL RECORDS: ACTIVE<br>
      DATABASE: <span class="status-live">ONLINE</span>
    </div>

  </aside>


  <main class="main">

    <header class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">GRI // INSTITUTIONAL NETWORK</h1>
        <div class="page-subtitle" id="pageSubtitle">
          PERSONNEL &amp; RESEARCH DIVISIONS INDEX
        </div>
      </div>

      <div class="status-stack">
        SYSTEM: <span class="status-live">ONLINE</span><br>
        DATABASE: PERSONNEL / 1996<br>
        ACCESS: INTERNAL
      </div>
    </header>


    <div class="toolbar">
      <input
        id="searchInput"
        class="tool-input"
        type="text"
        placeholder="SEARCH PERSONNEL / DIVISION / RANK"
        autocomplete="off"
      >

      <button class="action-btn" id="homeBtn">HOME</button>
    </div>


    <section id="content"></section>

  </main>

</div>


<div id="modalRoot"></div>
<div id="toast"></div>
<div id="ambientLog"></div>


<script>
(() => {

  const divisionOrder = [
    "astrophysics",
    "robotics",
    "chemistry",
    "biology",
    "quantum"
  ];

  const divisionNames = {
    astrophysics: "ASTROPHYSICS",
    robotics: "ROBOTICS",

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function initials(name) {
    const clean = String(name || "?")
      .replace(/^Dr\.?\s*/i, "")
      .trim();

    return clean
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map(part => part[0])
      .join("")
      .toUpperCase();
  }


  function showToast(message) {
    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
      toast.style.display = "none";
    }, 1800);
  }


  function countDivision(division) {
    return starterProfiles.filter(
      profile => profile.division === division
    ).length;
  }


  function divisionProfileList(division) {
    return starterProfiles
      .filter(profile => profile.division === division)
      .sort((a, b) => a.name.localeCompare(b.name));
  }


  function matchesSearch(profile) {
    if (!searchTerm) return true;

    const haystack = [
      profile.name,
      divisionNames[profile.division],
      profile.rank,
      profile.origin,
      profile.likes,
      profile.dislikes
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return haystack.includes(searchTerm.toLowerCase());
  }

    divisionNav.appendChild(overview);


    divisionOrder.forEach(division => {

      button.innerHTML = `

  function renderProfileGrid(division) {

    const list = divisionProfileList(division)
      .filter(matchesSearch);

    if (!list.length) {
      return `

    return `

            class="profile-card"

            id="closeInstitutional"
          >
            X
          </button>

        </div>


        <div class="profile-modal-body">

          <section class="profile-info">

            <h2 class="modal-name">
              ${escapeHTML(profile.name)}
            </h2>

            <div class="modal-rank">
              ${escapeHTML(profile.role)}
            </div>

            <div class="field-grid">

              <div class="field full">
                <div class="field-label">NOTES</div>
                <div class="field-value ${
                  profile.notes ? "" : "field-empty"
                }">
                  ${escapeHTML(
                    profile.notes ||
                    "NO ADDITIONAL INFORMATION AVAILABLE."
                  )}
                </div>
              </div>

            </div>

          </section>


          <aside class="portrait-panel">

            <div class="portrait-corner tl">
              INSTITUTIONAL FEED
            </div>

            <div class="portrait-corner tr">
              GRI // SECURE
            </div>

            <div class="portrait-frame">
              ${portrait}
              <div
                class="portrait-placeholder"
                style="${profile.portrait ? "display:none;" : ""}"
              >
                [ NO PORTRAIT ON FILE ]<br><br>
                SUBJECT // ${escapeHTML(initials(profile.name))}<br>
                IMAGE CHANNEL // OFFLINE
              </div>
            </div>

            <div class="portrait-corner bl">
              SIGNAL // CYAN
            </div>

            <div class="portrait-corner br">
              INTERNAL
            </div>

          </aside>

        </div>

      </div>
    `;


    modalRoot.classList.add("visible");


    document
      .getElementById("closeInstitutional")
      .addEventListener("click", closeProfile);


    modalRoot.addEventListener(
      "click",
      e => {
        if (e.target === modalRoot) {
          closeProfile();
        }
      },
      { once: true }
    );
  }


  function closeProfile() {
    modalRoot.classList.remove("visible");
    modalRoot.innerHTML = "";
  }


  function renderOverview() {

    const leadCount =
      starterProfiles.filter(profile =>
        (profile.rank || "")
          .toLowerCase()
          .includes("lead")
      ).length;


    const filledRecords =
      starterProfiles.filter(profile =>
        profile.origin ||
        profile.age ||
        profile.height ||
        profile.personality ||
        profile.motivation
      ).length;


    pageTitle.textContent =
      "GRI // INSTITUTIONAL NETWORK";

    pageSubtitle.textContent =
      "PERSONNEL & RESEARCH DIVISIONS INDEX";


    content.innerHTML = `

      <div class="dashboard-grid">

        <div class="metric">
          <div class="metric-label">PERSONNEL RECORDS</div>
          <div class="metric-value">
            ${starterProfiles.length}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">RESEARCH DIVISIONS</div>
          <div class="metric-value">
            ${divisionOrder.length}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">LEAD RECORDS</div>
          <div class="metric-value">
            ${leadCount}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">POPULATED FILES</div>
          <div class="metric-value">
            ${filledRecords}
          </div>
        </div>

      </div>


      <section class="dashboard-section">

        <div class="section-heading">
          <h2>RESEARCH DIVISIONS</h2>
          <span>SELECT DIVISION TO OPEN DIRECTORY</span>
        </div>

        <div class="division-grid">

          ${divisionOrder.map(division => {

            const knownLead =
              starterProfiles.find(profile =>
                profile.division === division &&
                (profile.rank || "")
                  .toLowerCase()
                  .includes("lead")
              );

            return `
              <button
                class="division-jump"
                data-division="${division}"
              >

                <div class="division-name">
                  ${divisionNames[division]}
                </div>

                <div class="division-meta">
                  RECORDS // ${countDivision(division)}<br>
                  ${knownLead
                    ? "LEAD // " + escapeHTML(knownLead.name)
                    : "LEAD // UNASSIGNED / UNKNOWN"
                  }
                </div>

              </button>
            `;
          }).join("")}

        </div>

      </section>


      <section class="dashboard-section">

        <div class="section-heading">
          <h2>INSTITUTIONAL PERSONNEL</h2>
          <span>HANDLER / MINISTERS / PROTECTOR</span>
        </div>

        <div class="profiles-grid">

          ${institutionalProfiles.map((profile, index) => `
            <article
              class="profile-card"
              data-institutional-id="${escapeHTML(profile.id)}"
            >

              <div class="profile-index">
                A-${String(index + 1).padStart(2, "0")}
              </div>

              <div class="profile-name">
                ${escapeHTML(profile.name)}
              </div>

              <div class="profile-rank">
                ${escapeHTML(profile.role)}
              </div>

              <div class="profile-meta">
                ${escapeHTML(
                  profile.notes ||
                  "INFORMATION PENDING"
                )}
              </div>

            </article>
          `).join("")}

        </div>

      </section>

    `;


    content
      .querySelectorAll(".division-jump")
      .forEach(button => {

        button.addEventListener("click", () => {

          currentView =
            button.dataset.division;

          render();
        });
      });


    content
      .querySelectorAll("[data-institutional-id]")
      .forEach(card => {

        card.addEventListener("click", () => {

          openInstitutionalProfile(
            card.dataset.institutionalId
          );
        });
      });
  }


  function renderDivision(division) {

    pageTitle.textContent =
      "GRI // " + divisionNames[division];

    pageSubtitle.textContent =
      "PERSONNEL DIRECTORY // " +
      countDivision(division) +
      " RECORDS";


    content.innerHTML = `

      <div class="directory-head">

        <div>
          <h2>${divisionNames[division]}</h2>
          <small>
            PERSONNEL RECORDS
          </small>
        </div>

      </div>

      ${renderProfileGrid(division)}
    `;


    bindProfileCards();
  }


  function renderSearchOverview() {

    pageTitle.textContent =
      "GRI // GLOBAL PERSONNEL SEARCH";

    pageSubtitle.textContent =
      "SEARCH RESULTS ACROSS ALL RESEARCH DIVISIONS";


    const results =
      starterProfiles
        .filter(matchesSearch)
        .sort((a, b) =>
          a.name.localeCompare(b.name)
        );


    content.innerHTML = `

      <div class="directory-head">

        <div>
          <h2>SEARCH RESULTS</h2>
          <small>
            ${results.length} MATCHES
          </small>
        </div>

      </div>


      ${
        results.length
          ? `
            <div class="profiles-grid">

              ${results.map((profile, index) => `
                <article
                  class="profile-card"
                  data-profile-id="${escapeHTML(profile.id)}"
                >

                  <div class="profile-index">
                    ${String(index + 1).padStart(2, "0")}
                  </div>

                  <div class="profile-name">
                    ${escapeHTML(profile.name)}
                  </div>

                  <div class="profile-rank">
                    ${escapeHTML(
                      profile.rank ||
                      "RANK UNASSIGNED"
                    )}
                  </div>

                  <div class="profile-meta">
                    ${escapeHTML(
                      divisionNames[profile.division]
                    )}<br>

                    ${
                      profile.origin
                        ? escapeHTML(profile.origin)
                        : "ORIGIN UNASSIGNED"
                    }
                  </div>

                </article>
              `).join("")}

            </div>
          `
          : `
            <div class="empty-results">
              NO RECORDS FOUND.
            </div>
          `
      }
    `;


    bindProfileCards();
  }


  function render() {

    renderNavigation();


    if (
      currentView === "overview" &&
      !searchTerm
    ) {
      renderOverview();
      return;
    }


    if (
      currentView === "overview" &&
      searchTerm
    ) {
      renderSearchOverview();
      return;
    }


    if (
      divisionOrder.includes(currentView)
    ) {
      renderDivision(currentView);
      return;
    }
  }


  /* ===== SEARCH ===== */

  searchInput.addEventListener(
    "input",
    () => {

      searchTerm =
        searchInput.value.trim();

      render();
    }
  );


  /* ===== HOME ===== */

  homeBtn.addEventListener(
    "click",
    () => {

      searchInput.value = "";
      searchTerm = "";
      currentView = "overview";

      render();

      showToast("OVERVIEW");
    }
  );


  /* ===== ESC ===== */

  document.addEventListener(
    "keydown",
    e => {

      if (
        e.key === "Escape" &&
        modalRoot.classList.contains("visible")
      ) {
        closeProfile();
      }

    }
  );


  /* ===== AMBIENT LOG ===== */

  const ambientLines = [
    "SYS CHECK OK",
    "PERSONNEL DATABASE ONLINE",
    "RESEARCH DIVISION INDEX STABLE",
    "UPLINK STABLE",
    "QUANTUM DIVISION // ACTIVE",
    "BIOLOGY DIVISION // ACTIVE",
    "CHEMISTRY DIVISION // ACTIVE",
    "ROBOTICS DIVISION // ACTIVE",
    "ASTROPHYSICS DIVISION // ACTIVE",
    "PERSONNEL SYNC COMPLETE",
    "PORTRAIT CHANNEL // STANDBY",
    "INTERNAL NETWORK // STABLE",
    "CHECKING FOR NEW RECRUITS...",
    "DATABASE CONSISTENCY // OK",
    "MEMORY BANKS // ONLINE",
    "SIGNAL NOISE: ACCEPTABLE",
    "GRI // 1996",
    "SEARCHING...",
    "CURRENT STATUS: OPERATIONAL",
    "PERSONNEL RECORD ACCESS // GRANTED"
  ];

  let ambientBuffer = [];


  function addAmbientLine(text) {

    ambientBuffer.push(text);

    if (ambientBuffer.length > 6) {
      ambientBuffer.shift();
    }

    ambientLog.textContent =
      ambientBuffer.join("\n");
  }


  function randomAmbient() {

    const line =
      ambientLines[
        Math.floor(
          Math.random() *
          ambientLines.length
        )
      ];

    addAmbientLine(line);
  }


  setTimeout(() => {

    randomAmbient();

    setInterval(
      randomAmbient,
      3500
    );

  }, 1000);


  render();

})();
</script>

</body>
</html>
