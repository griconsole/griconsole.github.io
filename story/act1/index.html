<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Act1 Story Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/faviconGRI.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/faviconGRI.png">

<style>
:root {
  --log-color: #00ffcc;
  --cyan: #00ffcc;
  --cyan-soft: rgba(0, 255, 204, .24);
  --page-bg: #020809;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { width: 100%; min-height: 100%; }

@media (min-width: 761px) {
  html, body { height: 100%; overflow: hidden; }
}

html {
  scrollbar-width: thin;
  scrollbar-color: var(--log-color) #100016;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0, 90, 88, .17), transparent 68%),
    linear-gradient(180deg, #02090a 0%, #010506 100%);
  color: var(--cyan);
  font-family: "Courier New", Courier, monospace;
  scrollbar-width: thin;
  scrollbar-color: var(--log-color) #100016;
}

::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

::-webkit-scrollbar-track {
  background: #100016;
  border-left: 1px solid rgba(0, 255, 204, .25);
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(to bottom, var(--log-color), #71009a);
  border: 2px solid #100016;
  border-radius: 0;
  box-shadow: inset 0 0 5px rgba(255, 255, 255, .12);
}

::-webkit-scrollbar-thumb:hover {
  background: #ef8cff;
  box-shadow: 0 0 9px var(--log-color);
}

::-webkit-scrollbar-corner { background: #100016; }

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: .2;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 255, 204, .075) 0,
    rgba(0, 255, 204, .075) 1px,
    transparent 1px,
    transparent 4px
  );
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 55%,
    rgba(0, 0, 0, .42) 100%
  );
}

main {
  width: min(100%, 1320px);
  height: 100svh;
  margin: 0 auto;
  padding: clamp(12px, 2vw, 24px);
}

.page-grid {
  display: grid;
  width: 100%;
  height: 100%;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: clamp(8px, 1vw, 14px);
}

.page-slot {
  position: relative;
  display: grid;
  place-items: center;
  width: auto;
  height: 100%;
  max-width: 100%;
  aspect-ratio: 210 / 297;
  overflow: hidden;
  padding: 0;
  border: 1px solid rgba(0, 255, 204, .29);
  border-radius: 1px;
  background: linear-gradient(
    145deg,
    rgba(0, 255, 204, .035),
    rgba(0, 20, 22, .16)
  );
  box-shadow:
    inset 0 0 26px rgba(0, 255, 204, .025),
    0 0 12px rgba(0, 255, 204, .025);
  color: var(--cyan);
  font: inherit;
  cursor: default;
  transition:
    border-color .22s ease,
    box-shadow .22s ease,
    background .22s ease;
}

.page-slot.empty { cursor: default; }

.page-slot.has-page {
  cursor: zoom-in;
  border-color: rgba(0, 255, 204, .48);
}

.page-slot.has-page:hover {
  border-color: rgba(0, 255, 204, .88);
  box-shadow:
    inset 0 0 30px rgba(0, 255, 204, .055),
    0 0 18px rgba(0, 255, 204, .12);
}

.page-slot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: rgba(0, 0, 0, .2);
}

.eta {
  padding: 12px;
  color: rgba(0, 255, 204, .34);
  font-size: clamp(12px, 1.25vw, 17px);
  letter-spacing: .14em;
  text-align: center;
  text-shadow: 0 0 10px rgba(0, 255, 204, .12);
  user-select: none;
}

.music-mute {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 1003;
  padding: 8px 12px;
  background: #000;
  color: var(--cyan);
  border: 1px solid var(--cyan);
  cursor: pointer;
  font-family: "Courier New", monospace;
  font-size: 11px;
}

.music-mute:hover {
  box-shadow: 0 0 8px rgba(0, 255, 204, .55);
}

.music-mute:active {
  background: var(--cyan);
  color: #000;
}

.viewer {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 5vh 5vw;
  background: rgba(0, 5, 6, .9);
  backdrop-filter: blur(5px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s ease, visibility .22s ease;
  cursor: zoom-out;
}

.viewer.open {
  opacity: 1;
  visibility: visible;
}

.viewer img {
  display: block;
  width: 94vw;
  height: 94vh;
  max-width: 94vw;
  max-height: 94vh;
  object-fit: contain;
  box-shadow: 0 0 38px rgba(0, 255, 204, .13);
  cursor: default;
  transform: scale(.985);
  transition: transform .22s ease;
}

.viewer.open img { transform: scale(1); }

@media (max-width: 760px) {
  html, body { height: auto; overflow-x: hidden; overflow-y: auto; }
  main { height: auto; min-height: 100svh; padding: 16px 12px 68px; }
  .page-grid {
    height: auto;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: none;
    gap: 12px;
  }
  .page-slot { width: 100%; height: auto; aspect-ratio: 210 / 297; }
  .eta { font-size: 12px; }
}

@media (max-width: 420px) {
  .page-grid { grid-template-columns: 1fr; }
  main { width: min(100%, 360px); }
}
</style>
</head>

<body>
<main>
  <section class="page-grid" id="pageGrid" aria-label="Manga pages"></section>
</main>

<div class="viewer" id="viewer" aria-hidden="true">
  <img id="viewerImage" alt="Enlarged manga page">
</div>

<button class="music-mute" id="musicMuteButton" type="button">MUTE</button>

<audio id="backgroundAudio" src="/assets/lab-loop.mp3" loop preload="auto"></audio>

<script>
const pages = [
  { src: "", eta: "ETA: 28.11.26" },
  { src: "", eta: "ETA: 30.11.26" },
  { src: "", eta: "ETA: 8.12.26" },
  { src: "", eta: "ETA: 10.12.26" },
  { src: "", eta: "ETA: 17.12.26" },
  { src: "", eta: "ETA: 19.12.26" }
];
// /assets/pages/testpage2.png /assets/pages/testpage1.png

const pageGrid = document.getElementById("pageGrid");
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const musicMuteButton = document.getElementById("musicMuteButton");
const backgroundAudio = document.getElementById("backgroundAudio");
let muted = false;

try {
  muted = localStorage.getItem("mangaArchiveMuted") === "true";
} catch (error) {
}

backgroundAudio.volume = 0.34;
backgroundAudio.muted = muted;

function updateMusicButton() {
  musicMuteButton.textContent = muted ? "UNMUTE" : "MUTE";
}

function saveMutePreference() {
  try {
    localStorage.setItem("mangaArchiveMuted", String(muted));
  } catch (error) {
  }
}

async function startMusic() {
  try {
    await backgroundAudio.play();
  } catch (error) {
  }
}

musicMuteButton.addEventListener("click", () => {
  muted = !muted;
  backgroundAudio.muted = muted;

  saveMutePreference();
  updateMusicButton();

  if (!muted) startMusic();
});

document.addEventListener("pointerdown", startMusic, { once: true });
document.addEventListener("keydown", startMusic, { once: true });

updateMusicButton();

function openViewer(src) {
  viewerImage.src = src;
  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeViewer() {
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  window.setTimeout(() => {
    if (!viewer.classList.contains("open")) {
      viewerImage.removeAttribute("src");
    }
  }, 240);
}

pages.forEach((page, index) => {
  const slot = document.createElement("button");

  slot.type = "button";
  slot.className = `page-slot ${page.src ? "has-page" : "empty"}`;

  slot.setAttribute(
    "aria-label",
    page.src
      ? `Open manga page ${index + 1}`
      : `Manga page ${index + 1}, ${page.eta}`
  );

  if (page.src) {
    const image = document.createElement("img");

    image.src = page.src;
    image.alt = `Manga page ${index + 1}`;
    image.loading = "lazy";

    slot.appendChild(image);
    slot.addEventListener("click", () => openViewer(page.src));
  } else {
    const eta = document.createElement("span");

    eta.className = "eta";
    eta.textContent = page.eta;

    slot.appendChild(eta);
    slot.disabled = true;
  }

  pageGrid.appendChild(slot);
});

viewer.addEventListener("click", closeViewer);

viewerImage.addEventListener("click", event => {
  event.stopPropagation();
});

window.addEventListener("keydown", event => {
  if (event.key === "Escape" && viewer.classList.contains("open")) {
    closeViewer();
  }
});
</script>
</body>
</html>
